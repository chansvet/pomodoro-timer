<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf3ee">
<!-- 홈 화면에 추가하면 전체화면으로 뜨고, 사파리가 탭을 정리해도 잘 안 꺼진다 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>뽀모도로</title>
<style>
  :root{
    --bg:#faf3ee;
    --bg2:#f3e4de;
    --card:#fffaf7;
    --ink:#6b5550;
    --ink-soft:#b7a49e;
    --pie:#dda3a8;
    --pie-deep:#d0898f;
    --tick:#cbb6ae;
    --track:#f2e5dd;
    --beige:#e4d3c8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* display를 지정한 요소에도 hidden이 먹도록 */
  [hidden]{display:none !important}
  body{
    min-height:100vh;
    display:flex;justify-content:center;   /* 세로 가운데는 .app의 margin:auto로 — 내용이 길어져도 위가 안 잘린다 */
    background:linear-gradient(165deg,var(--bg) 0%,var(--bg2) 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    color:var(--ink);padding:24px;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    width:100%;max-width:360px;margin:auto;
    background:var(--card);
    border-radius:34px;
    padding:22px 26px 26px;
    box-shadow:0 14px 44px rgba(160,120,110,.14);
    text-align:center;
    user-select:none;-webkit-user-select:none;
  }

  /* 모드 (아이콘) */
  .modes{
    display:flex;gap:4px;
    background:var(--track);border-radius:15px;padding:4px;
  }
  .modes button{
    flex:1;border:0;background:transparent;cursor:pointer;
    padding:9px 0;border-radius:12px;
    color:var(--ink-soft);transition:.25s;
    display:grid;place-items:center;
  }
  .modes button.on{
    background:var(--card);color:var(--ink);
    box-shadow:0 2px 8px rgba(160,120,110,.13);
  }

  /* 다이얼 */
  .dial{width:100%;display:block;margin:6px 0 2px;touch-action:none;cursor:grab}
  .dial.dragging{cursor:grabbing}
  .dial .num{
    font-size:11px;font-weight:500;fill:var(--ink-soft);
    font-family:inherit;
  }
  .dial .tick{stroke:var(--tick);stroke-linecap:round}
  .dial .tick.major{stroke-width:2.4}
  .dial .tick.minor{stroke-width:1.1;opacity:.65}
  .dial .pie{fill:var(--pie);transition:fill .4s}
  .dial .hand{stroke:var(--pie-deep);stroke-width:2.6;stroke-linecap:round;transition:stroke .4s}
  .dial .hub{fill:var(--pie-deep);transition:fill .4s}
  .dial .knob{fill:var(--card);stroke:var(--pie-deep);stroke-width:3;transition:r .15s,stroke .4s,opacity .3s}
  .dial.dragging .knob{r:10}
  /* 돌아가는 중엔 다이얼 잠금 */
  body.running .dial{cursor:default}
  body.running .knob{opacity:0}

  .time{
    font-size:44px;font-weight:300;letter-spacing:-.5px;
    font-variant-numeric:tabular-nums;
    margin:2px 0 20px;
  }

  /* 컨트롤 */
  .controls{display:flex;align-items:center;justify-content:center;gap:14px}
  button{font:inherit;border:0;cursor:pointer;transition:transform .15s,background .2s,color .2s}
  button:active{transform:scale(.94)}
  .primary{
    width:64px;height:64px;border-radius:50%;
    background:var(--pie);color:#fff;
    display:grid;place-items:center;
    box-shadow:0 7px 20px rgba(208,137,143,.35);
  }
  .primary:hover{background:var(--pie-deep)}
  .ghost{
    width:46px;height:46px;border-radius:50%;
    background:var(--track);color:var(--ink-soft);
    display:grid;place-items:center;
  }
  .ghost:hover{background:var(--beige);color:var(--ink)}

  /* 하단 */
  .foot{
    margin-top:22px;padding-top:18px;
    border-top:1px solid var(--track);
    display:flex;align-items:center;justify-content:space-between;
  }
  .dots{display:flex;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--beige);transition:.3s}
  .dot.done{background:var(--pie)}
  .tools{display:flex;gap:2px}
  .tool{
    background:none;color:var(--ink-soft);
    width:28px;height:28px;border-radius:8px;
    display:grid;place-items:center;
  }
  .tool:hover{color:var(--ink);background:var(--track)}
  .tool.on{color:var(--pie-deep)}

  /* 접히는 패널 (설정 · 기록) */
  .panel{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .panel.open{max-height:260px}
  .panel .inner{padding-top:18px;display:grid;gap:11px}
  .row{display:flex;align-items:center;justify-content:space-between}
  .row .ic{color:var(--ink-soft);display:grid;place-items:center}
  .row input{
    width:66px;padding:7px 10px;text-align:center;
    font:inherit;font-size:13px;color:var(--ink);
    border:1px solid var(--track);border-radius:9px;
    background:var(--bg);outline:none;
  }
  .row input:focus{border-color:var(--pie)}

  /* 기록 */
  .sum{display:flex;justify-content:center;gap:26px;align-items:center;color:var(--ink)}
  .sum span{display:flex;align-items:center;gap:7px;font-size:15px}
  .sum .ic{color:var(--ink-soft);display:grid;place-items:center}
  .sum b{font-weight:500;font-variant-numeric:tabular-nums}
  .bars{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:74px;margin-top:4px}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
  .bars .slot{flex:1;width:100%;display:flex;align-items:flex-end}
  .bars .bar{
    width:100%;border-radius:5px 5px 3px 3px;
    background:var(--beige);min-height:3px;transition:height .3s;
  }
  .bars .col.today .bar{background:var(--pie)}
  .bars .day{font-size:10px;color:var(--ink-soft)}
  .bars .col.today .day{color:var(--pie-deep);font-weight:600}

  /* 동기화 */
  .sync{margin-top:12px;padding-top:12px;border-top:1px solid var(--track)}
  .sync-row{display:flex;align-items:center;gap:8px}
  .sync .ic{color:var(--ink-soft);display:grid;place-items:center;flex:none}
  .sync .ic.ok{color:var(--pie-deep)}
  .sync input{
    flex:1;min-width:0;padding:7px 10px;
    font:inherit;font-size:13px;color:var(--ink);
    border:1px solid var(--track);border-radius:9px;
    background:var(--bg);outline:none;
  }
  .sync input:focus{border-color:var(--pie)}
  .sync .who{
    flex:1;min-width:0;text-align:left;font-size:12px;color:var(--ink-soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .sync-msg{margin-top:8px;font-size:12px;line-height:1.5;color:var(--ink-soft);text-align:left}
  .sync-msg.bad{color:#c0797d}
  .panel.open{max-height:400px}

  body.rest{--pie:#c6b3a3;--pie-deep:#b5a191}
</style>
</head>
<body>
<div class="app">

  <div class="modes">
    <!-- 집중 -->
    <button data-mode="focus" class="on" aria-label="집중">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <!-- 짧은 휴식 -->
    <button data-mode="short" aria-label="짧은 휴식">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/>
        <path d="M17 10h1.6a2.4 2.4 0 0 1 0 4.8H17"/>
        <path d="M8 3v2M12 3v2"/>
      </svg>
    </button>
    <!-- 긴 휴식 -->
    <button data-mode="long" aria-label="긴 휴식">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.8 6.8 0 0 0 11 11z"/>
      </svg>
    </button>
  </div>

  <svg class="dial" viewBox="0 0 300 300" id="dial">
    <g id="ticks"></g>
    <g id="nums"></g>
    <path class="pie" id="pie"></path>
    <line class="hand" id="hand" x1="150" y1="150" x2="150" y2="52"></line>
    <circle class="hub" cx="150" cy="150" r="4.5"></circle>
    <circle class="knob" id="knob" cx="150" cy="52" r="8"></circle>
  </svg>

  <div class="time" id="time">25:00</div>

  <div class="controls">
    <button class="ghost" id="reset" aria-label="리셋">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/>
      </svg>
    </button>

    <button class="primary" id="toggle" aria-label="시작/일시정지">
      <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8.5 5.4v13.2a.6.6 0 0 0 .93.5l9.6-6.6a.6.6 0 0 0 0-1l-9.6-6.6a.6.6 0 0 0-.93.5z"/>
      </svg>
      <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <rect x="7" y="5" width="3.6" height="14" rx="1.5"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.5"/>
      </svg>
    </button>

    <button class="ghost" id="skip" aria-label="건너뛰기">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 5l9 7-9 7z" fill="currentColor"/><path d="M19 5v14"/>
      </svg>
    </button>
  </div>

  <div class="foot">
    <div class="dots" id="dots"></div>
    <div class="tools">
      <!-- 화면 꺼짐 방지 -->
      <button class="tool" id="awake" aria-label="화면 꺼짐 방지" hidden>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>
      </button>
      <!-- 기록 -->
      <button class="tool" id="chart" aria-label="기록">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M5 20V11M12 20V4M19 20v-6"/>
        </svg>
      </button>
      <!-- 설정 -->
      <button class="tool" id="gear" aria-label="설정">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/>
          <circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="panel" id="stats">
    <div class="inner">
      <div class="sum">
        <span>
          <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none"/></svg></span>
          <b id="st-count">0</b>
        </span>
        <span>
          <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/></svg></span>
          <b id="st-time">0분</b>
        </span>
      </div>
      <div class="bars" id="st-bars"></div>

      <!-- 기기 간 동기화 -->
      <div class="sync" id="sync">
        <div class="sync-row" id="sync-out">
          <span class="ic" id="cloud-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.5 19H7a4.5 4.5 0 0 1-.6-8.96 6 6 0 0 1 11.6 1.46A3.75 3.75 0 0 1 17.5 19z"/>
            </svg>
          </span>
          <input type="email" id="sync-email" inputmode="email" autocomplete="email" placeholder="name@email.com">
          <button class="tool" id="sync-go" aria-label="로그인 링크 받기">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12h15"/><path d="M13 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
        <div class="sync-row" id="sync-in" hidden>
          <span class="ic ok">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.5 19H7a4.5 4.5 0 0 1-.6-8.96 6 6 0 0 1 11.6 1.46A3.75 3.75 0 0 1 17.5 19z"/>
              <path d="M9.5 13.5l2 2 3.5-4"/>
            </svg>
          </span>
          <span class="who" id="sync-who"></span>
          <button class="tool" id="sync-out-btn" aria-label="로그아웃">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/>
            </svg>
          </button>
        </div>
        <div class="sync-msg" id="sync-msg" hidden></div>
      </div>
    </div>
  </div>

  <div class="panel" id="settings">
    <div class="inner">
      <div class="row">
        <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none"/></svg></span>
        <input type="number" id="s-focus" min="1" max="60" value="25">
      </div>
      <div class="row">
        <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 10h1.6a2.4 2.4 0 0 1 0 4.8H17"/></svg></span>
        <input type="number" id="s-short" min="1" max="60" value="5">
      </div>
      <div class="row">
        <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.8 6.8 0 0 0 11 11z"/></svg></span>
        <input type="number" id="s-long" min="1" max="60" value="15">
      </div>
      <div class="row">
        <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3.5 3.5L17 9"/><path d="M20.5 5.5H7a4 4 0 0 0-4 4V11"/><path d="M7 22l-3.5-3.5L7 15"/><path d="M3.5 18.5H17a4 4 0 0 0 4-4V13"/></svg></span>
        <input type="number" id="s-round" min="2" max="8" value="4">
      </div>
    </div>
  </div>
</div>

<script>
/* 다이얼은 실제 타이머처럼 60분이 한 바퀴 — 25분이면 원의 25/60만큼 채워진다 */
const C = 150, R_PIE = 98;

/* localStorage가 막힌 환경(시크릿 모드 등)에서도 앱이 죽지 않게 항상 감싼다 */
const db = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } },
  set(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
};
const store = { save: v => db.set('pomo-cfg', v) };

const cfg = Object.assign(
  { focus: 25, short: 5, long: 15, round: 4, awake: true },
  db.get('pomo-cfg', {})
);

let mode = 'focus';
let left = cfg.focus * 60;
let running = false;
let ticker = null;
let done = 0;    // 누적 집중 횟수
let cycle = 0;   // 긴 휴식까지의 진행도
let endAt = 0;   // 절대 종료 시각 (탭이 백그라운드여도 안 밀리게)

const $ = id => document.getElementById(id);
const pie = $('pie'), timeEl = $('time'), hand = $('hand'), knob = $('knob'), dial = $('dial');
let dragging = false;

/* --- 눈금과 숫자 그리기 (한 번만) --- */
(function buildDial() {
  const pt = (min, r) => {
    const a = (-90 + min * 6) * Math.PI / 180;
    return [C + r * Math.cos(a), C + r * Math.sin(a)];
  };
  let ticks = '';
  for (let m = 0; m < 60; m++) {
    const major = m % 5 === 0;
    const [x1, y1] = pt(m, 118);
    const [x2, y2] = pt(m, major ? 104 : 112);
    ticks += `<line class="tick ${major ? 'major' : 'minor'}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }
  $('ticks').innerHTML = ticks;

  let nums = '';
  for (let m = 0; m < 60; m += 5) {
    const [x, y] = pt(m, 134);
    nums += `<text class="num" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central">${m}</text>`;
  }
  $('nums').innerHTML = nums;
})();

function wedge(frac) {
  if (frac <= 0) return '';
  if (frac >= 1) {  // 완전한 원은 호 하나로 못 그려서 반원 두 개로
    return `M ${C} ${C - R_PIE} A ${R_PIE} ${R_PIE} 0 1 1 ${C} ${C + R_PIE} A ${R_PIE} ${R_PIE} 0 1 1 ${C} ${C - R_PIE} Z`;
  }
  const a = (-90 + frac * 360) * Math.PI / 180;
  const x = C + R_PIE * Math.cos(a), y = C + R_PIE * Math.sin(a);
  return `M ${C} ${C} L ${C} ${C - R_PIE} A ${R_PIE} ${R_PIE} 0 ${frac > .5 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z`;
}

function total() { return cfg[mode] * 60; }

function render() {
  const m = Math.floor(left / 60), s = left % 60;
  timeEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

  const frac = Math.min(1, left / 3600);
  pie.setAttribute('d', wedge(frac));

  const a = (-90 + frac * 360) * Math.PI / 180;
  const hx = C + R_PIE * Math.cos(a), hy = C + R_PIE * Math.sin(a);
  hand.setAttribute('x2', hx.toFixed(2)); hand.setAttribute('y2', hy.toFixed(2));
  knob.setAttribute('cx', hx.toFixed(2)); knob.setAttribute('cy', hy.toFixed(2));

  $('icon-play').style.display  = running ? 'none' : '';
  $('icon-pause').style.display = running ? '' : 'none';

  document.title = running ? `${timeEl.textContent} · 뽀모도로` : '뽀모도로';
  document.body.classList.toggle('rest', mode !== 'focus');
  document.body.classList.toggle('running', running);

  document.querySelectorAll('.modes button')
    .forEach(b => b.classList.toggle('on', b.dataset.mode === mode));

  $('dots').innerHTML = Array.from({ length: cfg.round },
    (_, i) => `<span class="dot${i < cycle ? ' done' : ''}"></span>`).join('');

  saveState();
}

/* --- 하루 기록 --- */
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

function logFocus(seconds, counted) {
  if (seconds < 60) return;            // 1분도 안 한 건 기록하지 않는다
  const log = db.get('pomo-log', {});
  const k = dayKey(new Date());
  const e = log[k] || { sessions: 0, seconds: 0 };
  e.seconds += seconds;
  if (counted) e.sessions += 1;        // 끝까지 채운 세션만 횟수로
  log[k] = e;
  db.set('pomo-log', log);
  renderStats();
  syncLog();
}

function fmtMin(sec) {
  const m = Math.round(sec / 60);
  if (m < 60) return `${m}분`;
  return m % 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m / 60}시간`;
}

function renderStats() {
  const log = db.get('pomo-log', {});
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push({ d, ...(log[dayKey(d)] || { sessions: 0, seconds: 0 }) });
  }
  const today = days[6];
  $('st-count').textContent = today.sessions;
  $('st-time').textContent  = fmtMin(today.seconds);

  const max = Math.max(...days.map(x => x.seconds), 1);
  $('st-bars').innerHTML = days.map((x, i) => `
    <div class="col${i === 6 ? ' today' : ''}" title="${dayKey(x.d)} · ${x.sessions}회 · ${fmtMin(x.seconds)}">
      <div class="slot"><div class="bar" style="height:${x.seconds ? Math.max(6, x.seconds / max * 100) : 0}%"></div></div>
      <div class="day">${DAYS[x.d.getDay()]}</div>
    </div>`).join('');
}

function setMode(next, autostart = false) {
  mode = next;
  left = total();
  stop();
  if (autostart) start(); else render();
}

function start() {
  if (running) return;
  running = true;
  endAt = Date.now() + left * 1000;
  ticker = setInterval(tick, 200);
  keepAwake();
  render();
}

function stop() {
  running = false;
  clearInterval(ticker);
  render();
  // 잠금은 여기서 풀지 않는다 — 세션이 자동으로 넘어가는 사이에 놓아버리면
  // 터치 없이 다시 잡아야 해서 아이폰에서 실패한다. 직접 멈출 때만 푼다.
}

function tick() {
  const next = Math.max(0, Math.round((endAt - Date.now()) / 1000));
  if (next === left) return;
  left = next;
  if (left <= 0) { finish(); return; }
  render();
}

/* natural: 끝까지 채웠는지 (건너뛰기는 false) · autostart: 다음 세션 자동 시작 · silent: 알림음 생략 */
function finish({ natural = true, autostart = true, silent = false } = {}) {
  const elapsed = total() - left;
  stop();
  if (!silent && natural) chime(mode === 'focus' ? 'focus' : 'break');

  if (mode === 'focus') {
    logFocus(elapsed, natural);
    done++; cycle++;
    setMode(cycle >= cfg.round ? 'long' : 'short', autostart);   // 휴식은 바로 이어서
  } else {
    if (mode === 'long') cycle = 0;
    setMode('focus', false);   // 집중은 자동으로 시작하지 않는다 — 직접 누를 때까지 기다린다
    releaseAwake();            // 기다리는 동안 화면까지 붙잡고 있을 필요는 없다
  }
}

/* 종소리 하나를 울린다.
   종은 배음이 정수배가 아니라서, 어긋난 배음을 섞어야 삐-소리가 아닌 금속성이 난다.
   높은 배음일수록 빨리 사라지게 두면 여운이 자연스럽다. */
function bell(ac, freq, at, gain, dur) {
  [[1, 1, dur], [2.76, .34, dur * .5], [5.4, .14, dur * .27], [8.9, .06, dur * .15]]
    .forEach(([mult, amp, d]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.value = freq * mult;
      o.connect(g); g.connect(ac.destination);
      const t = ac.currentTime + .02 + at;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain * amp, t + .004);   // 때리는 순간
      g.gain.exponentialRampToValueAtTime(.0001, t + d);      // 여운
      o.start(t);
      o.stop(t + d + .05);
    });
}

/* 집중 끝: 맑은 종 한 번 "띵~"
   휴식 끝: 낮은 데서 올라가는 두 번 — 다시 시작하라는 신호라 구별된다 */
function chime(kind) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    if (kind === 'break') {
      bell(ac, 523.25, 0,    .26, 1.2);   // 도
      bell(ac, 698.46, 0.30, .26, 1.8);   // 파
    } else {
      bell(ac, 880, 0, .3, 2.6);          // 라
    }
    setTimeout(() => ac.close(), 4000);   // 세션마다 오디오 컨텍스트가 쌓이지 않게
  } catch (e) { /* 소리가 막힌 환경은 조용히 넘어간다 */ }
}

/* --- 기기 간 동기화 (Supabase) ---
   라이브러리 없이 fetch만 쓴다. 인터넷이 없거나 로그인을 안 했으면
   조용히 넘어가고 앱은 평소대로 로컬에만 기록한다. */
const SB_URL = 'https://dpnoqpjydkhvhyzgiugt.supabase.co';
const SB_KEY = 'sb_publishable_nQJxwchY07SUhwTiIyylpQ_0QN0XiVc';  // 공개용 키 — 노출돼도 안전하다

let auth = db.get('pomo-auth', null);

function sbHeaders(withToken = true) {
  const h = { apikey: SB_KEY, 'Content-Type': 'application/json' };
  if (withToken && auth) h.Authorization = `Bearer ${auth.access_token}`;
  return h;
}

function saveAuth(a) { auth = a; db.set('pomo-auth', a); renderSync(); }

function msg(text, bad = false) {
  const el = $('sync-msg');
  el.textContent = text;
  el.hidden = !text;
  el.classList.toggle('bad', bad);
}

// 토큰은 1시간이면 만료된다. 남은 시간이 1분 미만이면 미리 갱신.
async function freshToken() {
  if (!auth) return false;
  if (Date.now() < auth.expires_at - 60e3) return true;
  try {
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST', headers: sbHeaders(false),
      body: JSON.stringify({ refresh_token: auth.refresh_token })
    });
    if (!r.ok) throw new Error('refresh failed');
    storeSession(await r.json());
    return true;
  } catch (e) { return false; }
}

function storeSession(s) {
  saveAuth({
    access_token: s.access_token,
    refresh_token: s.refresh_token,
    expires_at: Date.now() + (s.expires_in || 3600) * 1000,
    email: s.user?.email || auth?.email || '',
    user_id: s.user?.id || auth?.user_id
  });
}

async function sendLink(email) {
  msg('보내는 중…');
  // 돌아올 주소는 본문이 아니라 쿼리 파라미터로 넘겨야 한다.
  // 본문에 넣으면 무시되고 Site URL로 떨어진다.
  const back = encodeURIComponent(location.href.split('#')[0]);
  try {
    const r = await fetch(`${SB_URL}/auth/v1/otp?redirect_to=${back}`, {
      method: 'POST', headers: sbHeaders(false),
      body: JSON.stringify({ email, create_user: true })
    });
    if (!r.ok) throw new Error((await r.json()).msg || '실패');
    msg('메일함을 확인하세요. 링크는 1시간 안에 눌러야 하고, 한 번만 쓸 수 있습니다.');
  } catch (e) {
    msg('메일을 보내지 못했습니다. 주소를 확인해 주세요.', true);
  }
}

// 매직링크를 누르면 토큰이 주소 뒤 #에 붙어서 돌아온다
function readRedirect() {
  const p = new URLSearchParams(location.hash.slice(1));

  if (p.get('error')) {   // 만료됐거나 이미 쓴 링크
    history.replaceState(null, '', location.pathname);
    $('stats').classList.add('open');
    msg(p.get('error_code') === 'otp_expired'
      ? '링크가 만료됐거나 이미 사용됐습니다. 아래에서 다시 받아 주세요.'
      : '로그인하지 못했습니다. 다시 시도해 주세요.', true);
    return false;
  }

  if (!p.get('access_token')) return false;
  storeSession({
    access_token: p.get('access_token'),
    refresh_token: p.get('refresh_token'),
    expires_in: +p.get('expires_in') || 3600
  });
  history.replaceState(null, '', location.pathname);
  return true;
}

async function fetchMe() {
  try {
    const r = await fetch(`${SB_URL}/auth/v1/user`, { headers: sbHeaders() });
    if (!r.ok) return;
    const u = await r.json();
    saveAuth({ ...auth, email: u.email, user_id: u.id });
  } catch (e) {}
}

/* 로컬 기록과 서버 기록을 합친다. 같은 날짜가 양쪽에 있으면 큰 값을 남긴다
   — 횟수와 시간은 줄어들 일이 없으니 이러면 어느 기기의 기록도 잃지 않는다. */
async function syncLog() {
  if (!auth || !(await freshToken())) return;
  const local = db.get('pomo-log', {});
  try {
    const r = await fetch(`${SB_URL}/rest/v1/pomo_log?select=day,sessions,seconds`, { headers: sbHeaders() });
    if (!r.ok) throw new Error('pull failed');
    const remote = await r.json();

    const merged = { ...local };
    remote.forEach(row => {
      const mine = merged[row.day];
      merged[row.day] = mine
        ? { sessions: Math.max(mine.sessions, row.sessions), seconds: Math.max(mine.seconds, row.seconds) }
        : { sessions: row.sessions, seconds: row.seconds };
    });
    db.set('pomo-log', merged);
    renderStats();

    // 서버가 모르거나 뒤처진 날짜만 올린다
    const byDay = Object.fromEntries(remote.map(x => [x.day, x]));
    const push = Object.entries(merged)
      .filter(([day, v]) => {
        const s = byDay[day];
        return !s || s.sessions !== v.sessions || s.seconds !== v.seconds;
      })
      .map(([day, v]) => ({ user_id: auth.user_id, day, sessions: v.sessions, seconds: v.seconds }));

    if (push.length) {
      await fetch(`${SB_URL}/rest/v1/pomo_log`, {
        method: 'POST',
        headers: { ...sbHeaders(), Prefer: 'resolution=merge-duplicates' },
        body: JSON.stringify(push)
      });
    }
    msg('');
  } catch (e) {
    msg('동기화하지 못했습니다. 기록은 이 기기에 저장돼 있습니다.', true);
  }
}

function renderSync() {
  const on = !!auth;
  $('sync-out').hidden = on;
  $('sync-in').hidden = !on;
  if (on) $('sync-who').textContent = auth.email || '연결됨';
}

/* --- 화면 꺼짐 방지 (Wake Lock) --- */
const wakeSupported = 'wakeLock' in navigator;
let wakeLock = null;

async function keepAwake() {
  if (!wakeSupported || !cfg.awake || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { /* 배터리 부족 등으로 거절되면 그냥 넘어간다 */ }
}

function releaseAwake() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

// 화면을 껐다 켜거나 다른 앱에 갔다 오면 잠금이 풀리므로 다시 잡는다
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (running) { keepAwake(); tick(); }
});

/* --- 껐다 켜도 이어지게 상태 저장 --- */
function saveState() {
  db.set('pomo-state', { mode, left, endAt, running, cycle, done });
}

function restoreState() {
  const s = db.get('pomo-state', null);
  if (!s) return;
  mode = s.mode || 'focus';
  cycle = s.cycle || 0;
  done  = s.done || 0;

  if (!s.running) { left = s.left ?? total(); return; }

  const remain = Math.round((s.endAt - Date.now()) / 1000);
  if (remain > 0) { left = remain; start(); return; }

  // 오래 방치된 세션은 실제로 집중한 게 아니니 기록하지 않고 그냥 되돌린다
  const endedAt = new Date(s.endAt);
  if (Date.now() - s.endAt > 2 * 3600e3 || dayKey(endedAt) !== dayKey(new Date())) {
    left = total();
    return;
  }

  // 자리를 비운 사이에 끝난 세션 — 기록만 남기고 다음 세션은 대기 상태로 둔다
  left = 0;
  finish({ autostart: false, silent: true });
}

/* --- 다이얼 돌려서 시간 맞추기 --- */
function minutesAt(e) {
  const r = dial.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 300 - C;
  const y = (e.clientY - r.top) / r.height * 300 - C;
  if (Math.hypot(x, y) > 132) return null;              // 다이얼 바깥은 무시
  const deg = (Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360;
  return Math.min(60, Math.max(1, Math.round(deg / 6)));  // 1분 단위, 1~60분
}

function setMinutes(min) {
  cfg[mode] = min;
  store.save(cfg);
  $('s-' + mode).value = min;
  left = min * 60;
  render();
}

dial.addEventListener('pointerdown', e => {
  if (running) return;            // 돌아가는 중엔 잠금 — 실수로 건드려도 안 바뀐다
  const min = minutesAt(e);
  if (min === null) return;
  dragging = true;
  dial.classList.add('dragging');
  dial.setPointerCapture(e.pointerId);
  setMinutes(min);
});

dial.addEventListener('pointermove', e => {
  if (!dragging) return;
  let min = minutesAt(e);
  if (min === null) return;
  // 꼭대기(0=60분)를 지날 때 1분↔60분으로 튀지 않게 끝에서 멈춘다
  if (min - cfg[mode] > 30) min = 1;
  else if (cfg[mode] - min > 30) min = 60;
  setMinutes(min);
});

['pointerup', 'pointercancel'].forEach(ev => dial.addEventListener(ev, () => {
  dragging = false;
  dial.classList.remove('dragging');
}));

/* --- 이벤트 --- */
$('toggle').onclick = () => running ? (stop(), releaseAwake()) : start();
$('reset').onclick  = () => { left = total(); stop(); releaseAwake(); };
$('skip').onclick   = () => finish({ natural: false });

// 패널은 한 번에 하나만 열린다
function togglePanel(id) {
  const el = $(id), wasOpen = el.classList.contains('open');
  ['stats', 'settings'].forEach(p => $(p).classList.remove('open'));
  if (!wasOpen) { el.classList.add('open'); if (id === 'stats') renderStats(); }
}
$('gear').onclick  = () => togglePanel('settings');
$('chart').onclick = () => togglePanel('stats');

$('sync-go').onclick = () => {
  const email = $('sync-email').value.trim();
  if (!email.includes('@')) { msg('이메일 주소를 입력해 주세요.', true); return; }
  sendLink(email);
};
$('sync-email').onkeydown = e => { if (e.key === 'Enter') $('sync-go').click(); };
$('sync-out-btn').onclick = () => {
  saveAuth(null);
  msg('이 기기에서 연결을 끊었습니다. 기록은 남아 있습니다.');
};

if (wakeSupported) {
  $('awake').hidden = false;
  $('awake').classList.toggle('on', cfg.awake);
  $('awake').onclick = () => {
    cfg.awake = !cfg.awake;
    store.save(cfg);
    $('awake').classList.toggle('on', cfg.awake);
    cfg.awake && running ? keepAwake() : releaseAwake();
  };
}

document.querySelectorAll('.modes button').forEach(b => {
  b.onclick = () => setMode(b.dataset.mode);
});

['focus', 'short', 'long', 'round'].forEach(k => {
  const el = $('s-' + k);
  el.value = cfg[k];
  el.onchange = () => {
    const v = Math.max(+el.min, Math.min(+el.max, +el.value || cfg[k]));
    el.value = v;
    cfg[k] = v;
    store.save(cfg);
    if (k === 'round' && cycle > v) cycle = 0;
    if (!running) left = total();
    render();
  };
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    running ? stop() : start();
  }
});

restoreState();
render();
renderStats();

// 매직링크로 막 돌아온 참이면 계정 정보를 받아오고, 아니면 저장된 로그인으로 바로 동기화
(async () => {
  const justLoggedIn = readRedirect();
  renderSync();
  if (!auth) return;
  if (justLoggedIn) { await fetchMe(); $('stats').classList.add('open'); }
  syncLog();
})();
</script>
</body>
